merge_rules:
  labels:
    trigger: "mergequeue"
    # The fleet's dispatcher labels a PR whose issue carries `priority:critical` (a
    # nightly-break fix or revert) with this; Aviator moves it to the front.
    skip_line: "mergequeue-skip-line"
  preconditions:
    number_of_approvals: 0
    required_checks:
      - "Tests passed"
      - "CLA Assistant Lite"
  merge_strategy:
    name: "squash"
  # Parallel mode: Aviator validates each queued PR on its own draft PR
  # (main + PRs ahead of it) and never pushes to the original PR branch,
  # so a merge no longer restarts CI on every other queued PR.
  merge_mode:
    type: "parallel"
    parallel_mode:
      max_parallel_builds: 3
      batch_size: 2
      skip_draft_when_up_to_date: true
      stuck_pr_timeout_mins: 45
