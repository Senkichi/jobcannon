name: ci
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs; pushes to main keep one run per commit (the
# group keys on the unique SHA, so nothing groups or cancels).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # No fork-PR gate: GitHub-hosted runners are ephemeral, isolated
    # per-job VMs, so running fork PR code here is safe and standard —
    # unlike the self-hosted runner this replaced, which needed the gate
    # (public PR #44) as a compensating control against arbitrary code
    # execution on the operator's own machine.
    #
    # HOSTED RUNNERS (2026-08-14): GitHub-hosted ubuntu-latest runners were
    # verified working today via a probe run that completed successfully —
    # the prior billing-block was stale. The self-hosted runner was
    # de-registered the same day. No Windows leg is added: the deploy
    # target is Linux, so ubuntu-latest alone gives the coverage that
    # matters.
    runs-on: ubuntu-latest
    services:
      # pgvector/pgvector:pg18, not plain postgres — the schema uses
      # vector(384) columns (jobcannon/db/migrations/m0005), which needs the
      # pgvector extension's shared library present in the image. A stock
      # postgres image can't CREATE EXTENSION vector at all.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # Explicit and hosted-runner-local now — no runner-machine .env to
      # reach, so there is no expression-context blanking hazard to avoid.
      POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # Hosted runners are ephemeral with no shared local disk cache to
          # corrupt (the self-hosted concern this guarded against no longer
          # applies), so the GitHub Actions cache is safe and speeds up
          # repeat installs.
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # jobcannon/db/migrations/m0005_postings_embedding.py runs
      # `CREATE EXTENSION IF NOT EXISTS vector` as its first statement, so
      # the fixture chain (tests/host/conftest.py postgres_test_dsn ->
      # jobcannon.db.migrate.run_migrations) creates the extension itself;
      # no separate psql step is needed.
      - run: uv run pytest -q --tb=short

  tests-passed:
    name: Tests passed
    # Single check branch protection / merge automation should require: it
    # always reports (if: always()), so it can never be skipped-green the
    # way a conditional test job could satisfy a required check without
    # actually running.
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require test success
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job result: ${{ needs.test.result }}"
            exit 1
          fi
