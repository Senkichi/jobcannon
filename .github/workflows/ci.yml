name: ci
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs; pushes to main keep one run per commit (the
# group keys on the unique SHA, so nothing groups or cancels).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # SELF-HOSTED, PERMANENTLY (owner decision 2026-08-26): this project does
    # not rely on GitHub-hosted runner minutes, now or ever. The `jcpub`
    # runners are the operator's own Windows machines, so the same-repo gate
    # below is a load-bearing compensating control, not a nicety: a
    # pull_request event from a fork would otherwise execute arbitrary code
    # on that machine. Fork PRs therefore do not run CI here. To test an
    # outside contribution, a maintainer pushes the fork's commits to a
    # branch in this repository (`git push origin <sha>:refs/heads/<name>`)
    # and opens a same-repo PR — the diff has then been read by a human
    # before it runs. Post-flip, "require approval for all outside
    # collaborators" is applied in repo settings as the second layer.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, jcpub]
    # No Postgres service container: the runner machine has its own PG18 +
    # pgvector instance and its per-runner `.env` provides
    # POSTGRES_ADMIN_DSN to every step. Do NOT re-declare that variable under
    # `env:` here — an expression-context reference blanks the runner-level
    # value (see the private repo's runner notes), and a literal DSN does not
    # belong in a tracked file. The fixture chain (tests/host/conftest.py
    # postgres_test_dsn -> jobcannon.db.migrate.run_migrations) creates a
    # uniquely named database per session, so two runners can test at once.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # A shared local disk cache on a persistent runner is a corruption
          # vector across concurrent jobs; the venv in _work already makes
          # repeat installs fast.
          enable-cache: false
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # jobcannon/db/migrations/m0005_postings_embedding.py runs
      # `CREATE EXTENSION IF NOT EXISTS vector` as its first statement, so
      # no separate psql step is needed.
      #
      # jobcannon#162 found os.fork() does not exist on Windows, so the two
      # fork-gated proof tests in tests/host/test_posthog_fork_atexit.py
      # cannot run on THIS job's runner regardless of what's installed
      # alongside it -- that's a Windows API gap, not a missing-tool gap,
      # and it never goes away. #162 also found neither WSL nor Docker
      # installed on the runner box at the time; that part of the finding
      # is now stale -- the box gained WSL2, and jobcannon#248 added the
      # `fork-proof` job below, which shells into it and runs the pair for
      # real. This env var remains the explicit, documented acknowledgment
      # that THIS job specifically can't run them:
      # test_posthog_fork_atexit.py's _require_fork_or_fail_loud gate FAILS
      # the build instead of silently skipping if this line is ever
      # removed without an equivalent gap-closer (fork-proof) in place.
      - name: Run tests
        run: uv run pytest -q --tb=short
        env:
          JC_FORK_TESTS_UNAVAILABLE: "1"

  fork-proof:
    name: Fork/atexit proof (WSL)
    # jobcannon#248 (follow-up to #162/#213): the jcpub runner box gained
    # WSL2 (Ubuntu) after #162 found neither WSL nor Docker installed there.
    # This job is the real os.fork() leg #162 couldn't provide: it shells
    # into WSL, pins Python 3.12 via uv (WSL's own system python is 3.14 --
    # the claim under proof is the 3.12.x fork/join chain
    # jobcannon/host/wiring.py's module docstring cites; uv currently
    # resolves 3.12.14, while the docstring's source read was performed
    # against 3.12.11 specifically), syncs the `dev` dependency group into
    # a WSL-native venv (never under /mnt/c -- 9p I/O there is slow, and
    # keeping the venv off the Windows-backed mount is cheap insurance
    # either way), and runs tests/host/test_posthog_fork_atexit.py WITHOUT
    # JC_FORK_TESTS_UNAVAILABLE set, so its two fork-gated tests actually
    # execute (PASS, not SKIP -- see that file's `_require_fork_or_fail_loud`
    # gate). Same runner labels as `test`/`migration-collision-guard`:
    # verified via `gh api repos/Senkichi/jobcannon/actions/runners` that
    # this repo's registered runners (jcpub-9800x3d-1/-2) carry only
    # [self-hosted, Windows, X64, jcpub] -- no `light`/`suite` split exists
    # here (that distinction is the PRIVATE job-cannon repo's runner
    # topology; do not carry it over). This job is short (~15-17s warm), so
    # it's cheap to share the same 2-runner `jcpub` pool as `test`. Same
    # same-repo-only gate as `test` above, for the same reason (no code
    # execution on this box for a fork PR).
    #
    # Runner-account risk, checked and resolved during review: the runner
    # service that executes this job logs on as NT AUTHORITY\NETWORK
    # SERVICE (verified via Get-CimInstance Win32_Service), not the
    # interactive account this job's WSL invocation was first proven under
    # -- and NETWORK SERVICE's own Windows profile shows no evidence any
    # WSL distro was ever registered directly under it (no
    # AppData\Local\Packages, where Store-installed distros live). WSL
    # distro registration is normally per-account, so that looked like a
    # real blocker. It wasn't: jobcannon#248's own PR (#249) CI run
    # completed this job successfully on the real runner
    # (jcpub-9800x3d-2, NETWORK SERVICE) -- 11 passed in 13.56s, both
    # fork-gated tests included -- so whatever env/profile setup this
    # runner already carries (its steps copy senki's .gitconfig, so some
    # deliberate account passthrough exists in its config) also makes its
    # WSL distro reachable. The `wsl.exe -l -q` precondition check below is
    # kept as a defensive belt-and-suspenders measure -- a clear,
    # diagnosable failure if that ever regresses -- not because the risk
    # is still open.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, jcpub]
    # The fork-gated tests themselves have a 10s SIGKILL bound (see the
    # test file), but that only covers fork()/join() -- it does not bound
    # the astral.sh installer curl, `uv python install`, `uv sync`, or WSL
    # startup ahead of it. Without a job-level cap, a stall in any of those
    # would pend the required tests-passed aggregate for up to GitHub's
    # 360-minute default. 10 minutes is generous headroom over the ~15-17s
    # warm-cache runtime observed in practice.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run fork/atexit proof under WSL (real os.fork())
        run: |
          # WSL distro registration is per-Windows-account (HKCU-scoped),
          # not machine-wide: a distro installed interactively under one
          # login is invisible to a process running as a different account.
          # This repo's runner service currently logs on as
          # NT AUTHORITY\NETWORK SERVICE (not the interactive account this
          # job's design was proven under -- see PR body for jobcannon#248),
          # so fail loud with a diagnosable message here instead of letting
          # that surface as an opaque wslpath/bash error further down.
          $distros = (wsl.exe -l -q 2>$null)
          if ($LASTEXITCODE -ne 0 -or -not $distros) {
            throw "No WSL distribution is visible to this job's Windows account. WSL distro registration is per-account -- if a distro was installed interactively under a different login, the runner service's logon account (see 'runs-on' account in Services) needs its own registered distro, or the service needs reconfiguring to run as that account. See jobcannon#248."
          }
          # GITHUB_WORKSPACE is a Windows path (C:\actions-runners\...).
          # wslpath -u silently mangles a raw backslash-form argument when
          # invoked through pwsh's native-exe argument passing (reproduced
          # 2026-08-28: backslash-letter runs got dropped, e.g.
          # "C:\Users\x" -> "C:Usersx"), so translate to forward slashes
          # first -- Windows paths accept either form, and wslpath -u
          # handles the forward-slash form cleanly.
          $winPathFwd = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $wslPath = (wsl.exe wslpath -u $winPathFwd).Trim()
          if (-not $wslPath) {
            throw "wslpath translation of '$env:GITHUB_WORKSPACE' produced no output"
          }
          # This file's two fork-gated tests need no Postgres (they build
          # HostConfig with an unroutable DSN and never open a pool -- see
          # the test module's own docstring), so POSTGRES_ADMIN_DSN is
          # deliberately not threaded through to WSL here.
          #
          # The venv is keyed by RUNNER_NAME, not a fixed path: this repo's
          # registered runners (jcpub-9800x3d-1/-2, verified via
          # `gh api .../actions/runners`) can both come online and share one
          # WSL instance and one $HOME on this box, so two fork-proof jobs
          # (e.g. two open PRs, or a PR run overlapping a push-to-main run)
          # can run concurrently. A shared fixed venv path would let a
          # `uv sync` from one checkout silently repoint site-packages at
          # whichever tree synced last, the same corruption class the
          # `enable-cache: false` comment on the `test` job above guards
          # against for the local disk cache.
          $runnerKey = if ($env:RUNNER_NAME) { $env:RUNNER_NAME -replace '[^A-Za-z0-9_.-]', '_' } else { 'local' }
          # PATH is exported before the `command -v uv` check, not after --
          # an unqualified check in a bare `bash -lc` login shell cannot
          # assume $HOME/.local/bin (uv's install target) is already on
          # PATH, and checking before exporting would re-run the installer
          # (and depend on astral.sh being reachable) on every single run.
          $bashScript = 'set -euo pipefail; export PATH="$HOME/.local/bin:$PATH"; command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh; export UV_PROJECT_ENVIRONMENT="$HOME/.venvs/jobcannon-fork-$2"; cd "$1"; uv python install 3.12; uv sync --dev --python 3.12; uv run --python 3.12 pytest tests/host/test_posthog_fork_atexit.py -n0 -p no:cacheprovider --tb=short'
          wsl.exe -e bash -lc $bashScript _ $wslPath $runnerKey
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  migration-collision-guard:
    name: Migration collision guard
    # Issue #211: scripts/new_migration.py mints a version free against
    # origin/main and every open PR it can see AT CREATION TIME, but that
    # view goes stale the moment a sibling PR merges or a new one opens
    # before this one does. This job narrows that window by re-checking at
    # review/merge time, on every PR event, against origin/main's CURRENT
    # head and every OTHER currently-open PR -- it does not fully close the
    # race (two PRs can each pass this same check within the same window and
    # still both merge back to back); jobcannon/db/migrations/__init__.py's
    # duplicate-version import check is the final backstop. Same
    # self-hosted-only, same-repo-only gate as `test` above, for the same
    # reason (pull_request reads the workflow file from the PR head, so a
    # fork could otherwise smuggle in arbitrary steps).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, jcpub]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      # scripts/check_migration_collisions.py is stdlib-only (urllib, not
      # `gh` -- nothing on this runner's PATH beyond what setup-uv provides
      # is assumed). --no-project skips syncing the full project
      # dependency set for a script that needs none of it.
      - name: Check migration version collisions
        run: uv run --no-project python scripts/check_migration_collisions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  tests-passed:
    name: Tests passed
    # Required check for branch protection / merge automation. `always()`
    # keeps the JOB itself from being skipped: GitHub reports a job skipped
    # by its own job-level `if:` as check-run conclusion "success" for
    # required-status-check purposes (a required check only needs
    # successful/skipped/neutral to unblock a merge), so gating this job's
    # `if:` the same way `test`/`fork-proof` are gated would turn a fork PR
    # straight into a passing required check instead of a failing one --
    # the opposite of hardening. The same-repo condition is therefore
    # applied per-STEP below instead of at the job level: a step skipped by
    # `if:` does not by itself change the job's overall conclusion, so the
    # job keeps reporting the real outcome. needs.*.result is evaluated
    # explicitly rather than relying on the default all-succeeded gate, so
    # any needed job's failure/cancellation still fails this one.
    # migration-collision-guard is allowed to be "skipped" (it only runs on
    # same-repo pull_request events -- a push to main has no PR to check)
    # but never "failure"/"cancelled".
    #
    # Same same-repo condition as the jobs above: this job's inline `run:`
    # content is, like every step in every job, read from the PR head on
    # pull_request events, so an unconditional step here would still be
    # schedulable onto the self-hosted pool from a fork PR even though
    # test/fork-proof/migration-collision-guard themselves already refuse
    # to run there. On a fork PR the real check step below is skipped and a
    # second step fails the job outright instead, so the required
    # "Tests passed" context still reports failure (never a skip, never a
    # pass) and a fork PR cannot merge directly -- the flow for an outside
    # contribution stays: a maintainer pushes the branch into this repo
    # (same-repo PR) to get CI to run.
    needs: [test, fork-proof, migration-collision-guard]
    if: always()
    runs-on: [self-hosted, Windows, X64, jcpub]
    steps:
      - name: Require test success
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job result: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.fork-proof.result }}" != "success" ]; then
            echo "fork-proof job result: ${{ needs.fork-proof.result }}"
            exit 1
          fi
          guard="${{ needs.migration-collision-guard.result }}"
          if [ "$guard" != "success" ] && [ "$guard" != "skipped" ]; then
            echo "migration-collision-guard job result: $guard"
            exit 1
          fi
      - name: Reject fork pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          echo "pull_request event from a fork: refusing to run this job's checks on self-hosted infra."
          exit 1
