name: ci
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs; pushes to main keep one run per commit (the
# group keys on the unique SHA, so nothing groups or cancels).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # SELF-HOSTED, PERMANENTLY (owner decision 2026-08-26): this project does
    # not rely on GitHub-hosted runner minutes, now or ever. The `jcpub`
    # runners are the operator's own Windows machines, so the same-repo gate
    # below is a load-bearing compensating control, not a nicety: a
    # pull_request event from a fork would otherwise execute arbitrary code
    # on that machine. Fork PRs therefore do not run CI here. To test an
    # outside contribution, a maintainer pushes the fork's commits to a
    # branch in this repository (`git push origin <sha>:refs/heads/<name>`)
    # and opens a same-repo PR — the diff has then been read by a human
    # before it runs. Post-flip, "require approval for all outside
    # collaborators" is applied in repo settings as the second layer.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, jcpub]
    # No Postgres service container: the runner machine has its own PG18 +
    # pgvector instance and its per-runner `.env` provides
    # POSTGRES_ADMIN_DSN to every step. Do NOT re-declare that variable under
    # `env:` here — an expression-context reference blanks the runner-level
    # value (see the private repo's runner notes), and a literal DSN does not
    # belong in a tracked file. The fixture chain (tests/host/conftest.py
    # postgres_test_dsn -> jobcannon.db.migrate.run_migrations) creates a
    # uniquely named database per session, so two runners can test at once.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # A shared local disk cache on a persistent runner is a corruption
          # vector across concurrent jobs; the venv in _work already makes
          # repeat installs fast.
          enable-cache: false
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # jobcannon/db/migrations/m0005_postings_embedding.py runs
      # `CREATE EXTENSION IF NOT EXISTS vector` as its first statement, so
      # no separate psql step is needed.
      #
      # jobcannon#162: os.fork() does not exist on Windows, so the two
      # fork-gated proof tests in tests/host/test_posthog_fork_atexit.py
      # cannot run on this self-hosted Windows runner (#162 also checked
      # WSL and Docker on the runner box -- neither is installed, so
      # there's no path to real fork() coverage here today). This env var
      # is the explicit, documented acknowledgment of that gap:
      # test_posthog_fork_atexit.py's _require_fork_or_fail_loud gate FAILS
      # the build instead of silently skipping if this line is ever
      # removed without the gap actually being closed.
      - name: Run tests
        run: uv run pytest -q --tb=short
        env:
          JC_FORK_TESTS_UNAVAILABLE: "1"

  migration-collision-guard:
    name: Migration collision guard
    # Issue #211: scripts/new_migration.py mints a version free against
    # origin/main and every open PR it can see AT CREATION TIME, but that
    # view goes stale the moment a sibling PR merges or a new one opens
    # before this one does. This job re-checks at review/merge time, on
    # every PR event, against origin/main's CURRENT head and every OTHER
    # currently-open PR -- the race the minting script structurally cannot
    # close on its own. Same self-hosted-only, same-repo-only gate as `test`
    # above, for the same reason (pull_request reads the workflow file from
    # the PR head, so a fork could otherwise smuggle in arbitrary steps).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, jcpub]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      # scripts/check_migration_collisions.py is stdlib-only (urllib, not
      # `gh` -- nothing on this runner's PATH beyond what setup-uv provides
      # is assumed). --no-project skips syncing the full project
      # dependency set for a script that needs none of it.
      - name: Check migration version collisions
        run: uv run --no-project python scripts/check_migration_collisions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  tests-passed:
    name: Tests passed
    # Single check branch protection / merge automation should require: it
    # always reports (if: always()), so it can never be skipped-green the
    # way a conditional test job could satisfy a required check without
    # actually running. A fork PR (test skipped) therefore fails this check
    # by construction. migration-collision-guard is allowed to be "skipped"
    # (it only runs on same-repo pull_request events -- a push to main has
    # no PR to check) but never "failure"/"cancelled".
    needs: [test, migration-collision-guard]
    if: always()
    runs-on: [self-hosted, Windows, X64, jcpub]
    steps:
      - name: Require test success
        shell: bash
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job result: ${{ needs.test.result }}"
            exit 1
          fi
          guard="${{ needs.migration-collision-guard.result }}"
          if [ "$guard" != "success" ] && [ "$guard" != "skipped" ]; then
            echo "migration-collision-guard job result: $guard"
            exit 1
          fi
