name: ci
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs; pushes to main keep one run per commit (the
# group keys on the unique SHA, so nothing groups or cancels).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted (owner directive, superseding jobcannon#160's "this
    # project does not rely on GitHub-hosted runner minutes, now or ever"):
    # that doctrine was written for a PRIVATE repo, where hosted minutes
    # cost money. This repo is public now -- public repos get GitHub-hosted
    # Actions minutes for FREE, and running self-hosted infra on a public
    # repo means a `pull_request` event from any fork can schedule
    # arbitrary workflow-file code onto the operator's own machine. Moving
    # to ubuntu-latest removes that attack surface entirely rather than
    # compensating for it -- the same-repo-only gate jobcannon#160 added
    # (and jobcannon#252 hardened) is therefore gone below, not tightened.
    # See the `tests-passed` job's own comment for the fork-PR flow this
    # repo uses instead, and the PR body for the full rationale.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # pg17, not pg18: render.yaml pins `postgresMajorVersion: "17"` for
        # the real production database, and matching production is more
        # representative than either the retired self-hosted box's PG18
        # (whatever happened to be installed there) or the pre-jobcannon#160
        # hosted-runner setup's own pg18 service container (see jobcannon#212's
        # quote of the conftest.py docstring from before that migration).
        # Nothing in this repo requires PG18 specifically: no migration uses
        # PG18-only syntax (the newest feature in play is `DROP DATABASE ...
        # WITH (FORCE)`, PG13+; pgvector's HNSW index needs pgvector>=0.5,
        # also available since PG13). Pinned by digest (review advisory):
        # a floating `pg17` tag lets a re-tagged upstream image change what
        # CI runs against with no diff here; the digest freezes the exact
        # image (pgvector 0.8.5 on pg17 at pin time). Bump deliberately by
        # updating the digest.
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # tests/host/conftest.py reads this directly (ADMIN_DSN =
      # os.environ.get("POSTGRES_ADMIN_DSN")); create_throwaway_db needs
      # CREATEDB privilege, which the image's default `postgres` superuser
      # has. A job-level env: is safe here, unlike on the old self-hosted
      # runner: there is no persistent runner-level POSTGRES_ADMIN_DSN a
      # step-level entry could shadow -- this ephemeral job's Postgres
      # service is the only instance that DSN could ever point at.
      POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # Ephemeral GitHub-hosted runner (fresh VM per job) -- unlike the
          # old persistent self-hosted box, there is no shared-disk
          # corruption vector across concurrent jobs to guard against here.
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # jobcannon/db/migrations/m0005_postings_embedding.py runs
      # `CREATE EXTENSION IF NOT EXISTS vector` as its first statement, so
      # no separate psql step is needed -- the pgvector/pgvector image
      # ships the extension's shared library; the migration itself
      # activates it inside the throwaway test database.
      #
      # os.fork() is native on ubuntu-latest (unlike the old Windows
      # runner), so tests/host/test_posthog_fork_atexit.py's two
      # fork-gated tests run for real right here now -- no
      # JC_FORK_TESTS_UNAVAILABLE opt-out needed or set. See that file's
      # `_require_fork_or_fail_loud` gate and its own module docstring:
      # "deleting the opt-out is all it takes for these tests to start
      # proving #132 again for real." The `fork-proof` job below still
      # runs the same pair again on purpose -- see its own comment.
      - name: Run tests
        run: uv run pytest -q --tb=short

  fork-proof:
    name: Fork/atexit proof
    # jobcannon#160 moved CI to self-hosted Windows runners, where
    # os.fork() does not exist; jobcannon#248 worked around that gap by
    # shelling into WSL2 from the Windows runner to reach a real Linux
    # process for jobcannon#132's fork/atexit proof. Now that CI runs on
    # ubuntu-latest directly, os.fork() is native and the entire WSL
    # indirection (distro-visibility precondition check, wslpath
    # translation, per-runner-name venv keying, NETWORK SERVICE account
    # investigation) is dead weight -- deleted below along with it.
    #
    # This job's two tests now ALSO run inside the main `test` job's full
    # pytest invocation above (nothing skips them there anymore). Kept as
    # its own job anyway for a distinct, easy-to-spot check-run signal on
    # the #132 proof specifically -- on GitHub-hosted, ephemeral,
    # free-for-public-repos runners, a few seconds of duplicated coverage
    # costs nothing. `-n0 -p no:cacheprovider` are carried over from the
    # old WSL job's invocation unchanged (single test file, avoid writing
    # pytest's cache into the checkout); that was WSL-mount pragmatics, not
    # a documented xdist-safety requirement, so this comment does not claim
    # one that isn't there.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --dev
      - name: Run fork/atexit proof (real os.fork())
        run: uv run pytest tests/host/test_posthog_fork_atexit.py -n0 -p no:cacheprovider --tb=short

  migration-collision-guard:
    name: Migration collision guard
    # Issue #211: scripts/new_migration.py mints a version free against
    # origin/main and every open PR it can see AT CREATION TIME, but that
    # view goes stale the moment a sibling PR merges or a new one opens
    # before this one does. This job narrows that window by re-checking at
    # review/merge time, on every PR event, against origin/main's CURRENT
    # head and every OTHER currently-open PR -- it does not fully close the
    # race (two PRs can each pass this same check within the same window and
    # still both merge back to back); jobcannon/db/migrations/__init__.py's
    # duplicate-version import check is the final backstop.
    #
    # Runs on every `pull_request` event now, including from forks --
    # unlike jobcannon#160/#252's same-repo-only gate, there's no reason to
    # withhold this check from an outside contribution. It's safe by
    # construction: scripts/check_migration_collisions.py is stdlib-only
    # (urllib, not `gh`) and read-only (lists PRs / reads file trees, never
    # writes), and GitHub hard-restricts a fork-triggered `pull_request`
    # run's GITHUB_TOKEN to read-only with no access to repo secrets beyond
    # itself, regardless of this repo's own `permissions:` grants -- so a
    # fork PR gains no additional access by running this job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      # --no-project skips syncing the full project dependency set for a
      # script that needs none of it.
      - name: Check migration version collisions
        run: uv run --no-project python scripts/check_migration_collisions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  tests-passed:
    name: Tests passed
    # Required check for branch protection / merge automation. `always()`
    # keeps the JOB itself from being skipped: GitHub reports a job skipped
    # by a failed dependency (the default `needs:` behavior) as check-run
    # conclusion `skipped`, and required-status-check semantics treat
    # `skipped` as passing -- so without `always()`, a failed `test` or
    # `fork-proof` run would turn this required check green instead of red.
    # needs.*.result is evaluated explicitly in the step below for the same
    # reason: `always()` bypasses the default all-succeeded gate, so this
    # job's own logic has to re-implement it.
    #
    # migration-collision-guard is allowed to be "skipped" (it only runs on
    # pull_request events -- a push to main has no PR to check) but never
    # "failure"/"cancelled".
    #
    # Fork PRs: jobcannon#160/#252's same-repo refusal is gone -- moving off
    # self-hosted infra removes the hazard that refusal existed to
    # compensate for, so this repo now runs CI for fork PRs the way any
    # other public GitHub project does. The repo's "require approval for
    # all outside collaborators" Actions setting is the resulting gate: an
    # unapproved fork PR's workflow runs sit PENDING (not failed) until a
    # maintainer approves them from the Actions tab, so this job simply
    # never completes (and this required check never reports success)
    # until that happens -- no fork-specific logic needed in this job
    # itself, unlike the old per-step same-repo guards.
    needs: [test, fork-proof, migration-collision-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all needed jobs to succeed
        shell: bash
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job result: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.fork-proof.result }}" != "success" ]; then
            echo "fork-proof job result: ${{ needs.fork-proof.result }}"
            exit 1
          fi
          guard="${{ needs.migration-collision-guard.result }}"
          if [ "$guard" != "success" ] && [ "$guard" != "skipped" ]; then
            echo "migration-collision-guard job result: $guard"
            exit 1
          fi
