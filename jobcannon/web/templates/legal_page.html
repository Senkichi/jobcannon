{% extends "base.html" %}
{% block title %}{{ title }} — Job Cannon{% endblock %}
{% block content %}
<style>
  /* Tailwind's CDN build has no @apply and its preflight strips default
     heading/table styling, so bare markdown output (h1-h3, p, table, a,
     blockquote, hr) needs real CSS here rather than utility classes —
     there is nothing to attach a class to inside the |safe-inserted HTML.
     Scoped to .legal-prose so it never leaks onto the rest of the app. */
  .legal-prose h1 { font-size: 1.5rem; font-weight: 600; color: #f5f5f5; margin-bottom: 0.75rem; }
  .legal-prose h2 { font-size: 1.15rem; font-weight: 600; color: #e5e5e5; margin-top: 2rem; margin-bottom: 0.5rem; }
  .legal-prose h3 { font-size: 1rem; font-weight: 600; color: #d4d4d4; margin-top: 1.5rem; margin-bottom: 0.5rem; }
  .legal-prose p, .legal-prose li { color: #a3a3a3; line-height: 1.65; margin-bottom: 0.75rem; }
  .legal-prose ul, .legal-prose ol { margin-left: 1.25rem; margin-bottom: 0.75rem; }
  .legal-prose strong { color: #e5e5e5; }
  /* #222: an inline markdown link's rendered box (terms.md's
     [Privacy Policy](/privacy), the only link any legal doc renders today
     -- see tests/host/test_touch_targets.py's #222 tests) measured
     94.3x21px, well under the 44px touch-target floor every OTHER
     interactive element on the site carries via touch_target() (#207).
     Vertical padding on an inline, non-replaced element (this stays the
     default `display: inline` -- NOT inline-block, which WOULD reflow)
     extends the element's own painted/hit-test box
     (getBoundingClientRect) without affecting the surrounding paragraph's
     line-box height or layout (CSS 2.1 10.6.1) -- verified empirically
     with Playwright (see the PR body): the link's rect grows to clear
     44px while the containing <p>'s own height and its next sibling's
     position are byte-for-byte unchanged. Horizontal padding is
     deliberately NOT added here -- unlike vertical, it DOES affect inline
     flow/line-wrapping, which is the whole reason this fix is vertical-
     only rather than a general padding bump. 14px top+bottom (not 12px)
     leaves real margin above the 44px floor rather than landing within a
     rounding error of it (21px content + 28px = 49px final height).
     tests/host/test_touch_targets.py's
     test_legal_prose_link_padding_clears_the_touch_target_floor requires
     BOTH declarations present with a nonzero px value each -- a
     `padding: 0` or a one-sided edit would fail it. */
  .legal-prose a { color: #d4d4d4; text-decoration: underline; padding-top: 14px; padding-bottom: 14px; }
  .legal-prose a:hover { color: #f5f5f5; }
  .legal-prose table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  .legal-prose th, .legal-prose td { border: 1px solid #404040; padding: 0.5rem 0.75rem; text-align: left; vertical-align: top; }
  .legal-prose th { background: #171717; color: #e5e5e5; }
  .legal-prose blockquote { border-left: 3px solid #404040; padding-left: 1rem; color: #737373; margin: 1rem 0; }
  .legal-prose hr { border: none; border-top: 1px solid #262626; margin: 2rem 0; }
  /* Narrow-viewport table fix: some legal-page tables (e.g. /privacy's
     Purpose/Data/Legal-basis columns) don't fit 390px even with the
     `width: 100%` above -- `table-layout: auto` (the default) treats a
     percentage width as a MINIMUM, not a cap, so a browser still grows the
     table past it when a cell's content can't wrap enough (CSS2.1
     17.5.2.2). Unwrapped, that growth pushes the whole *document*
     horizontally past the viewport, not just the table looking cramped.

     Fix is a scroll wrapper, not a breakpoint: jobcannon/web/legal.py's
     `_wrap_tables_for_scroll` (called from `_render`, the single render
     chokepoint) wraps every rendered `<table>...</table>` in
     `<div class="table-scroll">`. This ONE rule below -- no media query,
     no breakpoint -- gives that wrapper its own scroll container at every
     viewport width. `.legal-prose table` (width: 100%, above) is
     completely untouched at any width, so a table that already fit can
     never visually change; only a table whose content genuinely can't fit
     triggers the wrapper's internal scrollbar.

     `margin: 1rem 0 1.5rem` intentionally lives on the wrapper below, not
     on `.legal-prose table` above -- see `_wrap_tables_for_scroll`'s
     docstring (jobcannon/web/legal.py) for the full block-formatting-
     context / margin-collapse reasoning and the rejected earlier approach
     this rule replaces. tests/host/test_legal_table_scroll.py pins both
     the wrapper (structurally, via a real HTML parser) and this CSS rule
     (parsed as CSS, not string-matched), and sabotage-proves both. */
  .legal-prose .table-scroll { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; margin: 1rem 0 1.5rem; }
</style>
<div class="legal-prose">
{{ body_html|safe }}
</div>
{% endblock %}
