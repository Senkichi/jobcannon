{% extends "base.html" %}
{% block title %}My postings — Job Cannon{% endblock %}
{% block content %}
<h1 class="jc-title jc-title--roomy">My postings</h1>
<nav class="jc-cluster" data-postings-history-tabs>
  {% for token in views %}
    <a href="{{ url_for('postings_history.index', view=token) }}"
       class="jc-tab {{ 'jc-tab--active' if token == view else '' }} {{ touch_target() }}"
       {% if token == view %}aria-current="page"{% endif %}
       data-postings-history-tab="{{ token }}">
      {{ token | capitalize }}
    </a>
  {% endfor %}
</nav>
{% include "_postings_history_list.html" %}
{% endblock %}
