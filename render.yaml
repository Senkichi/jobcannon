# Render blueprint (spec §1 services layout). Deploying this is an OWNER
# action (paid resources) — see docs/deploy-runbook.md. Field names verified
# against Render's blueprint spec (render.com/docs/blueprint-spec) and its
# published JSON Schema (render.com/schema/render.yaml.json) on 2026-07-18 —
# no renames found (envVars items use `key`, not `name`; `fromDatabase.name`
# + `property: connectionString`; `basic-256mb` is a valid database `plan`
# enum value — that name denotes the RAM/instance tier only, NOT disk
# capacity; see the databases block below for diskSizeGB). The CI guards in
# tests/host/test_render_config.py keep the code-facing parts honest.
# No envVarGroups block this wave (spec §9 item 9 names "env/secret groups"):
# only jobcannon-web consumes the Clerk secrets and DATABASE_URL is already
# shared via fromDatabase — a group adds indirection with a single consumer.
# Revisit when a second service needs the same secret set.
databases:
  - name: jobcannon-db
    # `plan` selects the RAM/compute tier ("256mb" names RAM, not disk).
    # Disk capacity is `diskSizeGB` below, and it's what JC_DB_STORAGE_LIMIT_MB
    # (jobcannon-worker env) is calibrated against — Render defaults an
    # omitted diskSizeGB to 15GB on the Basic tier, which would silently
    # miscalibrate the storage alert if left implicit. Valid values are 1 or
    # any multiple of 5; 5GB is ample headroom for the 1B corpus at trivial
    # incremental cost.
    plan: basic-256mb
    diskSizeGB: 5
    postgresMajorVersion: "17"

services:
  - type: web
    name: jobcannon-web
    runtime: python
    plan: starter
    buildCommand: pip install uv && uv sync --locked --no-dev
    # --preload is load-bearing, not an optimization: it pins the process
    # topology to build-once-in-the-master-then-fork, which is what the
    # fork-safety hook in jobcannon/db/pool.py is written for (each worker
    # abandons the inherited pool and rebuilds its own). Production logs
    # from the 2026-08-26 incident show Render's runtime exhibited pre-fork
    # load even WITHOUT this flag (pin line stamped before the gunicorn
    # banner, zero per-worker pool builds) — the flag makes that topology
    # deterministic instead of environment-dependent.
    # --graceful-timeout pinned explicitly (jobcannon#137) rather than left
    # to gunicorn's implicit default (which also happens to be 30): worker
    # shutdown now has a documented, code-cross-checked budget instead of
    # an unstated assumption. jobcannon/host/wiring.py's
    # _POSTHOG_ATEXIT_JOIN_TIMEOUT_S (10s) bounds the slowest thing a
    # worker's atexit does today (flushing PostHog against a down
    # endpoint), so this value must stay >= that bound with real headroom —
    # tests/host/test_render_config.py cross-checks the two.
    startCommand: uv run --no-sync gunicorn --preload --workers 2 --graceful-timeout 30 --bind 0.0.0.0:$PORT "jobcannon.web:create_app()"
    healthCheckPath: /healthz
    envVars:
      # Pinned so a new service doesn't silently pick up Render's current
      # default (3.14.x — never exercised by this repo's CI). Keep in sync
      # with whatever Python version(s) CI tests as that changes.
      - key: PYTHON_VERSION
        value: "3.13.5"
      # Restored to the declarative fromDatabase form (mirroring the
      # worker's) after the 2026-08-26 incident closed. History: the fault
      # was originally misdiagnosed as a platform network problem on the
      # private DB path, so this key spent the incident as sync:false with
      # the endpoint managed via the dashboard/API. The real root cause
      # was gunicorn pre-fork pool inheritance (fork hook in
      # jobcannon/db/pool.py + --preload above; both endpoints wedged
      # identically, so the endpoint was never the fault). The dashboard
      # value was already the internal connection string — the same value
      # this resolves to — so this change is config hygiene, not a
      # behavior change.
      - key: DATABASE_URL
        fromDatabase:
          name: jobcannon-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      # Frontend (clerk-js) publishable key — issue #149. Loads clerk-js in
      # the browser so it can complete Clerk's cross-domain handshake and
      # set __session on this host; publishable keys are public by design
      # (safe to ship to the browser) but still sync:false to keep every
      # CLERK_* var's provenance in one place (the Clerk dashboard), not
      # split between here and there.
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: JC_SECRET_KEY
        sync: false
      - key: CLERK_SIGN_UP_URL
        sync: false
      # Sign-in counterpart (issue #145) -- already set live to
      # https://accounts.jobcannon.dev/sign-in alongside CLERK_SIGN_UP_URL
      # above; both were unlinked from any page until this change.
      - key: CLERK_SIGN_IN_URL
        sync: false
      # First cohort's signup wave label; captured into every session's
      # attribution at first contact (jobcannon.web.anon_session) so a later
      # signup can be attributed back to a cohort. Literal value, not a
      # secret.
      - key: JC_SIGNUP_WAVE
        value: "0"
      - key: POSTHOG_API_KEY
        sync: false
      # EU ingestion routing (data residency): committed rather than
      # sync:false since it's a routing choice, not a secret. Keep in
      # lockstep with jobcannon-worker's POSTHOG_HOST below — both
      # services build their own PostHog client through the same
      # wiring.py seam, so a mismatch would silently split analytics
      # across regions.
      - key: POSTHOG_HOST
        value: https://eu.i.posthog.com
      # Deterministic-pseudonym HMAC key (jobcannon/host/posthog_client.py's
      # pseudonymize()) — a DEDICATED secret, never the Flask session key
      # above. Declared on both services (worker builds its own PostHog
      # client too). If unset, analytics fan-out fails closed rather than
      # ever sending the raw Clerk user id to PostHog.
      - key: JC_ANALYTICS_PSEUDONYM_SALT
        sync: false

  - type: worker
    name: jobcannon-worker
    runtime: python
    # Starter (512Mi) was OOM-killing the worker even after capping fastembed's
    # batch_size (#111): the process's own steady-state baseline (procrastinate
    # + DB pool + 27 ATS scanner module imports + the embedding model, none of
    # it a single avoidable spike) sits within single-digit MB of 512Mi under
    # normal operation. A dashboard-only plan change is reverted by the next
    # blueprint sync since `plan` isn't `sync: false` -- must be committed here.
    plan: standard
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: uv run --no-sync python -m jobcannon.worker
    envVars:
      # Pinned so a new service doesn't silently pick up Render's current
      # default (3.14.x — never exercised by this repo's CI). Keep in sync
      # with whatever Python version(s) CI tests as that changes.
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        fromDatabase:
          name: jobcannon-db
          property: connectionString
      # Dropped from 2 to 1 after the OD-9 staging load test (spec §8, deploy
      # runbook step 5): concurrency=2 crash-looped the worker roughly every
      # 2 jobs on the starter plan (512MB) — the embedding model load
      # (fastembed/onnxruntime, jobcannon.engine.job_scorer) under two
      # concurrent `scan` jobs pushed memory over the limit, silently OOM-
      # killing the container (Render surfaces this only as "Instance
      # restarted", no explicit OOM log line) and leaving each in-flight job
      # orphaned in procrastinate_jobs (status='doing', worker_id=NULL —
      # issue #19 tracks cleanup tooling for that state, not prevention of
      # it). Revisit alongside a plan upgrade if throughput at 1 proves
      # insufficient once corpus volume grows.
      # 2026-08-26: re-confirmed at production corpus scale (deploy
      # runbook §7 rulings): the full company rotation completes daily at
      # concurrency 1 and the block report surfaced no platform-level
      # signal arguing for a change — the binding constraint remains this
      # plan's memory, so raise only alongside a plan re-evaluation.
      - key: JC_WORKER_CONCURRENCY
        value: "1"
      # Derived from jobcannon-db's diskSizeGB above (5GB * 1024) — must stay
      # in lockstep with it; tests/host/test_render_config.py guards the two
      # against drift.
      - key: JC_DB_STORAGE_LIMIT_MB
        value: "5120"
      # Pinned explicitly (issue #94 follow-up) so the retention windows
      # the published privacy policy promises (§9: 365-day event retention,
      # 30-day anonymous-user retention) are anchored in this committed
      # config rather than jobcannon/host/tasks.py's os.environ.get(...)
      # fallback defaults — a later code change to either default would
      # otherwise silently drift the deployed value away from what the
      # policy states, with no diff anywhere to catch it. Read by
      # reap_old_events / reap_anon_users (jobcannon/host/tasks.py); neither
      # is a HostConfig field (both read os.environ directly), so
      # tests/host/test_render_config.py's generic HostConfig-derived
      # required-var guard does not cover them — this comment is the
      # traceability instead.
      - key: JC_EVENTS_RETENTION_DAYS
        value: "365"
      - key: JC_ANON_RETENTION_DAYS
        value: "30"
      # PostHog wiring parity with jobcannon-web: the worker builds its own
      # client through the same wiring.py seam (init_engine_seams is called
      # unconditionally from jobcannon/worker/__main__.py). Previously
      # undeclared here, which left the worker's PostHog client silently
      # inert/unrouted regardless of the web service's configuration.
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://eu.i.posthog.com
      # Same dedicated secret as jobcannon-web's declaration above — both
      # services must be set to the SAME value (they pseudonymize the same
      # Clerk user ids), and this is a real secret so it stays sync: false
      # rather than a committed literal.
      - key: JC_ANALYTICS_PSEUDONYM_SALT
        sync: false
