[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobcannon"
version = "0.0.1"
description = "Job Cannon - the honest job feed. Public-track repo."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "lifelines>=0.29",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
