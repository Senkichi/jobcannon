[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobcannon"
version = "0.0.1"
description = "Job Cannon - the honest job feed. Public-track repo."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pycountry>=24.0",
    "geonamescache>=2.0",
    "markupsafe>=2.1",
    "trafilatura>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "lifelines>=0.29",
    "tabulate>=0.9",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["jobcannon"]
